[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wecoder"
description = "WeCoder.AI — an offline-first, model-agnostic AI software development team (engineering foundation)."
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WeCoder.AI contributors" }]
keywords = ["ai", "coding-agent", "cli", "offline-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = ["httpx>=0.27,<1", "pathspec>=0.12"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
wecoder = "wecoder.cli.app:main"

[tool.setuptools.dynamic]
version = { attr = "wecoder.__version__" }

[tool.setuptools.packages.find]
include = ["wecoder*"]

[tool.setuptools.package-data]
wecoder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["wecoder", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["wecoder"]
